allowBuilds:
  bufferutil: true
  electron: true
  electron-winstaller: true
  esbuild: true
  # appdmg's native deps, needed by the dmg maker on macOS runners. Both
  # compile from source via node-gyp -- no prebuilt binaries are downloaded.
  fs-xattr: true
  macos-alias: true
  # Upstream sets this to true. Kept false in this fork: node-pipewire's
  # install script runs node-pre-gyp, which downloads a prebuilt .node from
  # github.com/kakxem/node-pipewire/releases with no npm provenance
  # attestation. Cost of false: no screen-share audio on Wayland.
  node-pipewire: false
  register-scheme@https://codeload.github.com/devsnek/node-register-scheme/tar.gz/e7cc9a63a1f512565da44cb57316d9fb10750e17: true
  utf-8-validate: true

nodeLinker: hoisted

blockExoticSubdeps: false # required to make discord-rpc work

# Override for node 26 bug
overrides:
  yauzl: ^3.3.1
