name: Release Artifacts (macOS + Windows)

# Builds the artifacts that cannot be cross-compiled from Linux and attaches
# them to an existing release:
#   - macOS .dmg  (needs hdiutil, macOS only)
#   - Windows .exe Squirrel installer (needs wine+mono off-Windows)
# Linux .zip/.deb are built locally and uploaded when the release is created.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to"
        required: true
        type: string
      ref:
        description: "Commit/branch to build (defaults to the tag)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # a mis-set keychain partition list makes codesign hang on an invisible GUI
    # prompt rather than fail, so cap the job well under the 6h default
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64 (dmg)
            os: macos-latest
            platform: darwin
            arch: arm64
            targets: dmg
          # Intel build runs on the arm64 runner: the macos-13 Intel runners
          # are retired and jobs targeting them queue forever. @electron/packager
          # just downloads the darwin-x64 Electron, and codesign can ad-hoc sign
          # x64 binaries from Apple Silicon, so cross-arch packaging is fine.
          - label: macOS x64 (dmg)
            os: macos-latest
            platform: darwin
            arch: x64
            targets: dmg
          - label: Windows x64 (installer)
            os: windows-latest
            platform: win32
            arch: x64
            targets: squirrel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Imports the self-signed signing certificate into a throwaway keychain so
      # codesign can use it non-interactively. Optional: with no certificate
      # configured the build still signs, ad-hoc, which is enough to produce a
      # launchable bundle. The certificate only buys a *stable* signing identity
      # so macOS keeps the user's Accessibility grant across updates -- see the
      # osxSign comment in forge.config.ts.
      #
      # The guard lives inside the step because `secrets` is not available to a
      # job-level `if` (same reason as release-webhook.yml).
      - name: Import signing certificate
        if: matrix.platform == 'darwin'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          # Must match the CNs used by tools/gen-signing-cert.sh.
          LEAF_CN: "Stoat Fork Code Signing"
          ROOT_CN: "Stoat Fork Signing Root"
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret; signing ad-hoc."
            echo "Grants will not survive this update -- see issue #1."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/stoat-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PW"
          P12="$RUNNER_TEMP/cert.p12"
          ROOT="$RUNNER_TEMP/root.pem"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # outlast any plausible build; a keychain that re-locks mid-sign makes
          # codesign start failing partway through the bundle
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security

          # macOS gates private-key access behind an ACL partition list; without
          # this codesign raises an "allow access" dialog that hangs a headless
          # runner until the job times out
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # prepend, don't replace: dropping the login keychain from the search
          # list breaks unrelated tooling on the runner
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          for cn in "$LEAF_CN" "$ROOT_CN"; do
            if ! security find-certificate -c "$cn" "$KEYCHAIN" >/dev/null 2>&1; then
              echo "::error::certificate '$cn' missing after import -- is the root bundled in the .p12?"
              exit 1
            fi
          done

          # Trust our own ROOT (not the leaf: add-trusted-cert -r trustRoot on a
          # CA:false cert fails with SecTrustSettingsSetTrustSettings "parameters
          # not valid"). Two things need this:
          #   - codesign sets kCMSCertificateChainWithRootOrFail, so it must be
          #     able to build and embed the chain up to the root, or it dies with
          #     errSecInternalComponent on the first file it signs
          #   - `security find-identity -v` hides anything CSSMERR_TP_NOT_TRUSTED
          # Only the build machine needs this. End-user Macs never see the cert:
          # signature checking uses implicit anchors, so the embedded self-signed
          # root validates on a machine that has never encountered it.
          security find-certificate -c "$ROOT_CN" -p "$KEYCHAIN" > "$ROOT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$ROOT"

          # A trusted root is what makes the identity valid, and an invalid
          # identity means codesign cannot build its chain -- so this is fatal,
          # not informational.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "$LEAF_CN"; then
            echo "::error::'$LEAF_CN' is not a valid codesigning identity after trusting the root"
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN"

          {
            echo "MACOS_SIGN_IDENTITY=$LEAF_CN"
            echo "MACOS_SIGN_KEYCHAIN=$KEYCHAIN"
            echo "MACOS_SIGN_CN=$LEAF_CN"
          } >> "$GITHUB_ENV"

          rm -f "$P12" "$ROOT"

      - name: Make distributables
        run: >
          pnpm exec electron-forge make
          --platform=${{ matrix.platform }}
          --arch=${{ matrix.arch }}
          --targets=${{ matrix.targets }}

      # Guards the exact defect behind issue #1: @electron/packager downgrades a
      # signing failure to a warning (createSignOpts defaults continueOnError to
      # true), so a bundle with no resource seal sailed through as a green build
      # and then died on Apple Silicon with "damaged and can't be opened".
      #
      # Checked twice: the packaged .app, then the copy inside the .dmg. appdmg
      # is a separate chance to lose the seal, and the .dmg is what users get.
      - name: Verify macOS signature
        if: matrix.platform == 'darwin'
        run: |
          set -euo pipefail
          ./.github/scripts/verify-macos-signing.sh \
            "out/Stoat-darwin-${{ matrix.arch }}/Stoat.app"

          DMG="$(find out/make -type f -name '*.dmg' -print -quit)"
          [ -n "$DMG" ] || { echo "::error::no dmg produced"; exit 1; }
          MNT="$(mktemp -d)"
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly -quiet
          ./.github/scripts/verify-macos-signing.sh "$MNT/Stoat.app"

      # AMFI kills a binary whose signature it rejects before any of the app's
      # own code runs, and no static check catches that. `--version` exercises
      # dyld and the signature check without needing a window server.
      #
      # Deliberately narrow: only a kill signal fails the job. The runner has no
      # real GUI session, so an ordinary non-zero exit says nothing useful.
      # (Do not reach for `timeout` here -- macOS has no GNU coreutils, and it
      # exits 127 "command not found", which silently passes.)
      - name: Launch smoke test
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64'
        run: |
          set +e
          "out/Stoat-darwin-arm64/Stoat.app/Contents/MacOS/stoat-desktop" \
            --version >/dev/null 2>&1
          rc=$?
          echo "exit code: $rc"
          # 137 = SIGKILL (AMFI), 134 = SIGABRT
          if [ "$rc" = 137 ] || [ "$rc" = 134 ]; then
            echo "::error::binary was killed on launch -- signature rejected by AMFI"
            exit 1
          fi
          if [ "$rc" = 127 ]; then
            echo "::error::executable not found; the smoke test is not testing anything"
            exit 1
          fi

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # rename so the arch is visible in the release asset list
          find out/make -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 |
            while IFS= read -r -d '' f; do
              ext="${f##*.}"
              gh release upload "${{ inputs.tag }}" \
                "$f#Stoat-${{ matrix.platform }}-${{ matrix.arch }}.$ext" --clobber
            done

      # Runs even when the build fails, so a signing key is never left behind on
      # a runner. Best effort throughout: the keychain may not exist.
      - name: Remove signing keychain
        if: always() && matrix.platform == 'darwin'
        run: |
          security delete-keychain "$RUNNER_TEMP/stoat-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/root.pem"
